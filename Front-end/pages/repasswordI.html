<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBlockWallet - Forget Password</title>
    <link rel="icon" type="image/png" href="/photo/B-removebg-preview-r.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/stylesII.css">
    <style>
        /* ซ่อน Pop-up เป็นค่าเริ่มต้นแบบถาวร จะโชว์เมื่อหลังบ้านสั่งมาเท่านั้น */
        #lock-popup {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        #lock-popup.hidden { display: none !important; }
        .lock-card {
            background: #ffffff; padding: 30px; border-radius: 16px; text-align: center; max-width: 400px; width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">

    <!-- Pop-up นับถอยหลัง (ซ่อนอยู่ และจะแสดงเฉพาะตอนติดล็อกจากการกรอกวันเกิดหรือ OTP ผิดเกินกำหนด) -->
    <div id="lock-popup" class="hidden">
        <div class="lock-card">
            <h3 class="text-xl font-bold text-red-600 mb-2">⚠️ บัญชีถูกระงับการใช้งานชั่วคราว</h3>
            <p id="lock-message" class="text-sm text-gray-600 mb-4">บัญชีของคุณถูกล็อกเนื่องจากกรอกข้อมูลผิดเกินกำหนด กรุณาลองใหม่อีกครั้งภายใน:</p>
            <div id="countdown-timer" class="text-2xl font-bold text-purple-700 bg-purple-50 py-3 rounded-lg border border-purple-200 mb-4">
                00 : 00 : 00
            </div>
            <p class="text-xs text-gray-400">เมื่อครบกำหนดเวลา ระบบจะปลดล็อกให้อัตโนมัติ</p>
        </div>
    </div>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-[640px] bg-white rounded-2xl p-10 md:p-12 shadow-2xl relative text-black text-center">
            
            <h1 class="text-3xl font-semibold tracking-wide text-gray-800 mb-8">Forget Password</h1>
            
            <form class="space-y-4 max-w-[420px] mx-auto text-left">
                <div>
                    <input type="email" placeholder="อีเมล" class="w-full bg-[#e0e0e0] border border-gray-400/50 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-purple-600 transition-all placeholder-gray-500 text-gray-800 shadow-inner">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="relative">
                        <input type="text" id="birthdate" placeholder="mm/dd/yyyy" onfocus="(this.type='date')" onblur="(this.type='text')" class="w-full bg-[#e0e0e0] border border-gray-400/50 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-purple-600 transition-all placeholder-gray-500 text-gray-800 shadow-inner">
                    </div>
                    <div>
                        <input type="text" id="age" placeholder="อายุ (อัตโนมัติ)" readonly class="w-full bg-[#d0d0d0] border border-gray-400/50 rounded-lg px-4 py-2.5 text-sm focus:outline-none text-gray-700 shadow-inner cursor-not-allowed">
                    </div>
                </div>
                
                <div class="pt-2">
                    <label class="text-sm font-semibold text-gray-800 block mb-2">OTP:</label>
                    <div class="flex justify-between gap-2 max-w-[320px]">
                        <input type="text" maxlength="1" class="otp-input w-10 h-10 bg-[#e0e0e0] border border-gray-400/50 rounded-lg text-center text-lg font-bold focus:outline-none focus:border-purple-600 text-gray-800 shadow-inner">
                        <input type="text" maxlength="1" class="otp-input w-10 h-10 bg-[#e0e0e0] border border-gray-400/50 rounded-lg text-center text-lg font-bold focus:outline-none focus:border-purple-600 text-gray-800 shadow-inner">
                        <input type="text" maxlength="1" class="otp-input w-10 h-10 bg-[#e0e0e0] border border-gray-400/50 rounded-lg text-center text-lg font-bold focus:outline-none focus:border-purple-600 text-gray-800 shadow-inner">
                        <input type="text" maxlength="1" class="otp-input w-10 h-10 bg-[#e0e0e0] border border-gray-400/50 rounded-lg text-center text-lg font-bold focus:outline-none focus:border-purple-600 text-gray-800 shadow-inner">
                        <input type="text" maxlength="1" class="otp-input w-10 h-10 bg-[#e0e0e0] border border-gray-400/50 rounded-lg text-center text-lg font-bold focus:outline-none focus:border-purple-600 text-gray-800 shadow-inner">
                        <input type="text" maxlength="1" class="otp-input w-10 h-10 bg-[#e0e0e0] border border-gray-400/50 rounded-lg text-center text-lg font-bold focus:outline-none focus:border-purple-600 text-gray-800 shadow-inner">
                    </div>
                    
                    <div class="mt-3 flex items-center space-x-1.5 text-[12px]">
                        <span id="otp-icon" class="text-gray-500">🔄</span>
                        <button type="button" id="otp-request-btn" class="text-purple-600 font-semibold hover:underline focus:outline-none transition-all">
                            ขอรหัส OTP
                        </button>
                    </div>
                </div>
                
                <div class="text-center pt-6">
                    <button type="submit" id="forget-submit-btn" class="w-full max-w-[180px] bg-[#cc0000]/10 hover:bg-[#cc0000]/20 text-black border border-gray-400 font-medium py-2 rounded-lg text-sm transition-all shadow-sm active:scale-95">
                        ยืนยัน
                    </button>
                </div>
            </form>
            
            <div class="absolute bottom-4 right-6">
                <a href="/pages/login.html" class="text-[11px] text-gray-500 hover:text-black font-light transition-colors flex items-center space-x-0.5">
                    <span>เข้าสู่ระบบ</span>
                    <span class="text-[9px]">▶❚</span>
                </a>
            </div>
            
        </div>
    </main>

    <div id="app-footer" class="w-full"></div>

    <script>
        // 🌟 ระบบคำนวณอายุอัตโนมัติจากวันเกิด
        const birthdateInput = document.getElementById('birthdate');
        const ageInput = document.getElementById('age');
        const forgetForm = document.querySelector('form');
        const otpBtn = document.getElementById('otp-request-btn');
        const forgetSubmitBtn = document.getElementById('forget-submit-btn');
        const lockPopup = document.getElementById('lock-popup');
        const countdownTimerEl = document.getElementById('countdown-timer');
        const lockMessageEl = document.getElementById('lock-message');
        let globalLockInterval = null;

        // 🛡️ ฟังก์ชันสั่งแสดง Pop-up นับถอยหลังเมื่อบัญชีถูกล็อก (สอดคล้องกับหน้า Login)
        function startLockCountdown(lockUntilMs, customMessage) {
            if (globalLockInterval) clearInterval(globalLockInterval);

            if (customMessage) lockMessageEl.innerText = customMessage;

            otpBtn.disabled = true;
            otpBtn.classList.add('text-gray-400', 'cursor-not-allowed');
            forgetSubmitBtn.disabled = true;
            forgetSubmitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            lockPopup.classList.remove('hidden');

            globalLockInterval = setInterval(() => {
                const now = Date.now();
                const distance = lockUntilMs - now;

                if (distance <= 0) {
                    clearInterval(globalLockInterval);
                    globalLockInterval = null;
                    lockPopup.classList.add('hidden');

                    otpBtn.disabled = false;
                    otpBtn.classList.remove('text-gray-400', 'cursor-not-allowed');
                    forgetSubmitBtn.disabled = false;
                    forgetSubmitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    return;
                }

                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                countdownTimerEl.innerText = 
                    `${String(hours).padStart(2, '0')} : ${String(minutes).padStart(2, '0')} : ${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        birthdateInput.addEventListener('change', () => {
            if (!birthdateInput.value) return;

            const birthDate = new Date(birthdateInput.value);
            const today = new Date('2026-06-21'); 
            
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }

            ageInput.value = age >= 0 ? age : 0;
        });

        // 1. ระบบกระโดดช่อง OTP อัตโนมัติ (Auto-focus)
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length >= 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === "Backspace" && e.target.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        let timer = null;

        // 2. โลจิกปุ่มขอ OTP ยืนยันประวัติ (พร้อมดักจับสถานะล็อกบัญชีและโชว์ Pop-up)
        otpBtn.addEventListener('click', async () => {
            if (timer !== null) return;

            const emailValue = forgetForm.querySelector('input[placeholder="อีเมล"]').value;
            const birthDateValue = birthdateInput.value;

            if (!emailValue || !birthDateValue) {
                alert("⚠️ โปรดกรอก อีเมล และ เลือกวันเดือนปีเกิด ให้ครบถ้วนก่อนขอรหัส OTP");
                return;
            }

            try {
                otpBtn.disabled = true;
                otpBtn.innerText = "กำลังตรวจสอบ...";

                const response = await fetch('/api/auth/forget-password-request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailValue, birthDate: birthDateValue })
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    // ถ้าระบบหลังบ้านส่งเวลากลับมาว่าโดนล็อก ให้เปิด Pop-up นับถอยหลังทันที
                    if (result.lockUntilMs) {
                        startLockCountdown(result.lockUntilMs, result.message);
                    }
                    alert("❌ " + (result.message || "ตรวจสอบข้อมูลล้มเหลว"));
                    otpBtn.disabled = false;
                    otpBtn.innerText = "ขอรหัส OTP";
                    return;
                }

                alert("📧 ยืนยันข้อมูลสำเร็จ! ระบบได้ส่งรหัส OTP สำหรับตั้งรหัสใหม่เข้าอีเมลคุณแล้ว (มีอายุ 3 นาที)");

                let timeLeft = 60;
                otpBtn.classList.remove('text-purple-600', 'hover:underline');
                otpBtn.classList.add('text-gray-500', 'cursor-not-allowed');
                otpBtn.innerText = `กรุณาลองใหม่ในอีก ${timeLeft}s`;

                timer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        timer = null;
                        otpBtn.disabled = false;
                        otpBtn.classList.remove('text-gray-500', 'cursor-not-allowed');
                        otpBtn.classList.add('text-purple-600', 'hover:underline');
                        otpBtn.innerText = "ขอรหัส OTP";
                    } else {
                        otpBtn.innerText = `กรุณาลองใหม่ในอีก ${timeLeft}s`;
                    }
                }, 1000);

            } catch (error) {
                console.error(error);
                alert("❌ ระบบขัดข้อง ไม่สามารถติดต่อเซิร์ฟเวอร์หลังบ้านได้");
                otpBtn.disabled = false;
                otpBtn.innerText = "ขอรหัส OTP";
            }
        });

        // 3. ระบบกดยืนยันตรวจสอบ OTP 6 หลัก (พร้อมดักจับสถานะล็อกบัญชีและโชว์ Pop-up)
        forgetForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const emailValue = forgetForm.querySelector('input[placeholder="อีเมล"]').value;
            const birthDateValue = birthdateInput.value;
            
            let otpValue = "";
            inputs.forEach(input => otpValue += input.value);

            if (otpValue.length < 6) {
                alert("⚠️ โปรดกรอกรหัส OTP ให้ครบทั้ง 6 หลัก");
                return;
            }

            try {
                const response = await fetch('/api/auth/forget-password-verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailValue, birthDate: birthDateValue, otp: otpValue })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    sessionStorage.setItem('user_reset_email', emailValue);
                    alert("🎉 ยืนยันรหัส OTP ถูกต้อง! ระบบกำลังพาท่านไปหน้าตั้งรหัสผ่านใหม่");
                    window.location.href = "repasswordII.html"; 
                } else {
                    if (result.lockUntilMs) {
                        startLockCountdown(result.lockUntilMs, result.message);
                    }
                    alert("❌ " + (result.message || "ยืนยันรหัส OTP ไม่สำเร็จ"));
                }
            } catch (error) {
                console.error(error);
                alert("❌ ไม่สามารถเชื่อมต่อหลังบ้านเพื่อตรวจสอบได้");
            }
        });

        // 4. จัดการโหลดส่วนโครงสร้าง Footer
        document.addEventListener('DOMContentLoaded', () => {
            const footer = document.getElementById('app-footer');
            if (footer) {
                footer.innerHTML = `
                    <footer class="w-full bg-[#0c0b24] text-white py-4 text-center text-[10px] text-gray-400 border-t border-white/5">
                        Copyright © 2026 BBlockWallet.com. All rights reserved.
                    </footer>
                `;
            }
        });
    </script>
</body>
</html>
