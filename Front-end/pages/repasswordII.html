<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBlockWallet - Reset Password</title>
    <link rel="icon" type="image/png" href="/photo/B-removebg-preview-r.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../src/stylesII.css">
    <style>
        /* ซ่อนไอคอนรูปตาอัตโนมัติของ Microsoft Edge / Chrome ในช่องรหัสผ่าน */
        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none;
        }
        input[type="password"]::-webkit-credentials-auto-fill-button {
            visibility: hidden;
            position: absolute;
            right: 0;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-[640px] bg-white rounded-2xl p-10 md:p-12 shadow-2xl relative text-black text-center">
            
            <h1 class="text-3xl font-semibold tracking-wide text-gray-800 mb-8">Reset Password</h1>
            
            <form id="reset-password-form" class="space-y-4 max-w-[420px] mx-auto text-left">
                
                <div>
                    <input type="email" id="reset-email" placeholder="ยืนยันอีเมลของคุณ" required class="w-full bg-[#e0e0e0] border border-gray-400/50 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-purple-600 transition-all placeholder-gray-500 text-gray-800 shadow-inner">
                </div>

                <!-- ช่องกรอกรหัสผ่านใหม่ (จำกัด 8 ตัว + ปุ่มรูปตาเปิด/ปิด) -->
                <div class="relative">
                    <input type="password" id="new-password" placeholder="รหัสผ่านใหม่ (8 ตัวอักษร)" maxlength="8" required class="w-full bg-[#e0e0e0] border border-gray-400/50 rounded-lg px-4 py-2.5 pr-10 text-sm focus:outline-none focus:border-purple-600 transition-all placeholder-gray-500 text-gray-800 shadow-inner">
                    <button type="button" id="toggle-new-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-800 focus:outline-none">
                        <i class="fa-regular fa-eye" id="eye-icon-1"></i>
                    </button>
                </div>
                
                <!-- ช่องยืนยันรหัสผ่าน (จำกัด 8 ตัว + ปุ่มรูปตาเปิด/ปิด) -->
                <div class="relative">
                    <input type="password" id="confirm-password" placeholder="ยืนยันรหัสผ่าน (8 ตัวอักษร)" maxlength="8" required class="w-full bg-[#e0e0e0] border border-gray-400/50 rounded-lg px-4 py-2.5 pr-10 text-sm focus:outline-none focus:border-purple-600 transition-all placeholder-gray-500 text-gray-800 shadow-inner">
                    <button type="button" id="toggle-confirm-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-800 focus:outline-none">
                        <i class="fa-regular fa-eye" id="eye-icon-2"></i>
                    </button>
                </div>
                
                <p id="error-message" class="text-red-500 text-xs hidden text-center pt-1">❌ รหัสผ่านทั้งสองช่องไม่ตรงกัน</p>
                
                <div class="text-center pt-6">
                    <button type="submit" class="w-full max-w-[180px] bg-[#cc0000]/10 hover:bg-[#cc0000]/20 text-black border border-gray-400 font-medium py-2 rounded-lg text-sm transition-all shadow-sm active:scale-95">
                        ยืนยัน
                    </button>
                </div>
            </form>
            
        </div>
    </main>

    <div id="app-footer" class="w-full"></div>

    <script>
        const form = document.getElementById('reset-password-form');
        const resetEmail = document.getElementById('reset-email');
        const newPassword = document.getElementById('new-password');
        const confirmPassword = document.getElementById('confirm-password');
        const errorMessage = document.getElementById('error-message');

        // 👁️ ระบบสลับซ่อน/แสดงรหัสผ่านช่องที่ 1
        const toggleNewPasswordBtn = document.getElementById('toggle-new-password');
        const eyeIcon1 = document.getElementById('eye-icon-1');
        toggleNewPasswordBtn.addEventListener('click', () => {
            const isPassword = newPassword.type === 'password';
            newPassword.type = isPassword ? 'text' : 'password';
            eyeIcon1.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
        });

        // 👁️ ระบบสลับซ่อน/แสดงรหัสผ่านช่องที่ 2
        const toggleConfirmPasswordBtn = document.getElementById('toggle-confirm-password');
        const eyeIcon2 = document.getElementById('eye-icon-2');
        toggleConfirmPasswordBtn.addEventListener('click', () => {
            const isPassword = confirmPassword.type === 'password';
            confirmPassword.type = isPassword ? 'text' : 'password';
            eyeIcon2.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
        });

        // ✨ ดึงความจำจาก sessionStorage มาล็อกอินพุตไว้ล่วงหน้า
        document.addEventListener('DOMContentLoaded', () => {
            const savedEmail = sessionStorage.getItem('user_reset_email');
            if (savedEmail) {
                resetEmail.value = savedEmail;
                resetEmail.readOnly = true; 
                resetEmail.classList.add('bg-[#d0d0d0]', 'cursor-not-allowed', 'text-gray-700');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); 

            // 1. ตรวจสอบว่ารหัสผ่านตรงกันไหม
            if (newPassword.value !== confirmPassword.value) {
                errorMessage.classList.remove('hidden');
                confirmPassword.focus();
                return;
            }
            
            errorMessage.classList.add('hidden');

            // 2. ดักเช็กเงื่อนไขความยาวสเปกรหัสผ่านต้องเป็น 8 ตัวอักษรเป๊ะๆ (รองรับ A-Z, a-z, 0-9 และอักขระพิเศษทั้งหมด)
            const passwordRegex = /^[A-Za-z0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]{8}$/;
            if (!passwordRegex.test(newPassword.value)) {
                alert("⚠️ รหัสผ่านใหม่ต้องมีความยาว 8 ตัวอักษรพอดี (ประกอบด้วยอังกฤษ ตัวเลข หรืออักขระพิเศษ)");
                return;
            }

            try {
                // ยิงข้อมูลรหัสผ่านใหม่ข้ามพอร์ตไปอัปเดตที่หลังบ้าน
                const response = await fetch('/api/auth/reset-password-submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: resetEmail.value,
                        newPassword: newPassword.value
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    alert("🎉 อัปเดตข้อมูลรหัสผ่านใหม่ลงคลังฐานข้อมูลสำเร็จ! ระบบพากลับหน้าล็อกอิน");
                    
                    // ล้างแคชความจำความปลอดภัยทิ้ง
                    sessionStorage.removeItem('user_reset_email');
                    
                    // 🚪 หมุนหน้าจอเด้งกลับไปหน้าเข้าสู่ระบบตัวแรกสุด
                    window.location.href = 'login.html';
                } else {
                    alert("❌ เปลี่ยนรหัสผ่านล้มเหลว: " + result.message);
                }

            } catch (error) {
                console.error(error);
                alert("❌ ระบบขัดข้อง ไม่สามารถสั่งบันทึกรหัสผ่านลงคลาวด์ได้");
            }
        });

        confirmPassword.addEventListener('input', () => {
            errorMessage.classList.add('hidden');
        });

        // โหลด Footer อัตโนมัติ
        document.addEventListener('DOMContentLoaded', () => {
            const footer = document.getElementById('app-footer');
            if (footer) {
                footer.innerHTML = `
                    <footer class="w-full bg-[#0c0b24] text-white py-4 text-center text-[10px] text-gray-400 border-t border-white/5">
                        Copyright © 2026 BBlockWallet.com. All rights reserved.
                    </footer>
                `;
            }
        });
    </script>
</body>
</html>
