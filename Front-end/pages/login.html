<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBlockWallet - Login</title>
    <link rel="icon" type="image/png" href="/photo/B-removebg-preview-r.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../src/stylesII.css">
    <style>
        /* ซ่อน Pop-up เป็นค่าเริ่มต้นแบบถาวร จะโชว์เมื่อหลังบ้านสั่งมาเท่านั้น */
        #lock-popup {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); display: flex; align-items: center; justify-content: center; z-index: 9999;
        }
        #lock-popup.hidden { display: none !important; }
        .lock-card {
            background: #ffffff; padding: 30px; border-radius: 16px; text-align: center; max-width: 400px; width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* ซ่อนไอคอนรูปตาอัตรโนมัติของ Microsoft Edge / Chrome ในช่องรหัสผ่าน */
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
        display: none;
    }
    input[type="password"]::-webkit-credentials-auto-fill-button {
        visibility: hidden;
        position: absolute;
        right: 0;
    }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">

    <!-- Pop-up นับถอยหลัง (ซ่อนอยู่ และจะแสดงเฉพาะตอนติดล็อกจริงๆ เท่านั้น) -->
    <div id="lock-popup" class="hidden">
        <div class="lock-card">
            <h3 class="text-xl font-bold text-red-600 mb-2">⚠️ บัญชีถูกระงับการใช้งานชั่วคราว</h3>
            <p id="lock-message" class="text-sm text-gray-600 mb-4">บัญชีของคุณถูกล็อกเนื่องจากกรอกข้อมูลผิดเกินกำหนด กรุณาลองใหม่อีกครั้งภายใน:</p>
            <div id="countdown-timer" class="text-2xl font-bold text-purple-700 bg-purple-50 py-3 rounded-lg border border-purple-200 mb-4">
                00 : 00 : 00
            </div>
            <p class="text-xs text-gray-400">เมื่อครบกำหนดเวลา ระบบจะปลดล็อกให้อัตโนมัติ</p>
        </div>
    </div>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-[640px] bg-white rounded-2xl p-10 md:p-12 shadow-2xl relative text-black text-center">
            
            <h1 class="text-3xl font-semibold tracking-wide text-gray-800 mb-8">Login</h1>
            
            <form class="space-y-4 max-w-[420px] mx-auto text-left">
                <div>
                    <input type="email" placeholder="อีเมล" class="w-full bg-[#e0e0e0] border border-gray-400/50 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-purple-600 transition-all placeholder-gray-500 text-gray-800 shadow-inner">
                </div>
                
                <div class="relative">
                    <input type="password" id="password-input" placeholder="รหัสผ่าน (8 ตัวอักษร)" maxlength="8" class="w-full bg-[#e0e0e0] border border-gray-400/50 rounded-lg px-4 py-2.5 pr-10 text-sm focus:outline-none focus:border-purple-600 transition-all placeholder-gray-500 text-gray-800 shadow-inner">
                    <button type="button" id="toggle-password" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-800 focus:outline-none">
                        <i class="fa-regular fa-eye" id="eye-icon"></i>
                    </button>
                </div>
                
                <div class="pt-2">
                    <label class="text-sm font-semibold text-gray-800 block mb-2">OTP:</label>
                    <div class="flex justify-between gap-2 max-w-[320px]">
                        <input type="text" maxlength="1" class="otp-input w-10 h-10 bg-[#e0e0e0] border border-gray-400/50 rounded-lg text-center text-lg font-bold focus:outline-none focus:border-purple-600 text-gray-800 shadow-inner">
                        <input type="text" maxlength="1" class="otp-input w-10 h-10 bg-[#e0e0e0] border border-gray-400/50 rounded-lg text-center text-lg font-bold focus:outline-none focus:border-purple-600 text-gray-800 shadow-inner">
                        <input type="text" maxlength="1" class="otp-input w-10 h-10 bg-[#e0e0e0] border border-gray-400/50 rounded-lg text-center text-lg font-bold focus:outline-none focus:border-purple-600 text-gray-800 shadow-inner">
                        <input type="text" maxlength="1" class="otp-input w-10 h-10 bg-[#e0e0e0] border border-gray-400/50 rounded-lg text-center text-lg font-bold focus:outline-none focus:border-purple-600 text-gray-800 shadow-inner">
                        <input type="text" maxlength="1" class="otp-input w-10 h-10 bg-[#e0e0e0] border border-gray-400/50 rounded-lg text-center text-lg font-bold focus:outline-none focus:border-purple-600 text-gray-800 shadow-inner">
                        <input type="text" maxlength="1" class="otp-input w-10 h-10 bg-[#e0e0e0] border border-gray-400/50 rounded-lg text-center text-lg font-bold focus:outline-none focus:border-purple-600 text-gray-800 shadow-inner">
                    </div>
                    
                    <div class="mt-3 flex items-center space-x-1.5 text-[12px]">
                        <span id="otp-icon" class="text-gray-500">🔄</span>
                        <button type="button" id="otp-request-btn" class="text-purple-600 font-semibold hover:underline focus:outline-none transition-all">
                            ขอรหัส OTP
                        </button>
                    </div>
                </div>
                
                <div class="text-center pt-4 pb-2">
                    <a href="/pages/repasswordI.html" class="text-sm font-semibold text-gray-800 hover:underline">
                        ลืมรหัสผ่าน?
                    </a>
                </div>
                
                <div class="text-center">
                    <button type="submit" id="login-submit-btn" class="w-full max-w-[180px] bg-[#cc0000]/10 hover:bg-[#cc0000]/20 text-black border border-gray-400 font-medium py-2 rounded-lg text-sm transition-all shadow-sm active:scale-95">
                        เข้าสู่ระบบ
                    </button>
                </div>
            </form>
            
            <div class="absolute bottom-4 right-6">
                <a href="/pages/register.html" class="text-[11px] text-gray-500 hover:text-black font-light transition-colors flex items-center space-x-0.5">
                    <span>สมัครสมาชิก</span>
                    <span class="text-[9px]">▶❚</span>
                </a>
            </div>
            
        </div>
    </main>

    <div id="app-footer" class="w-full"></div>

    <script>
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password-input');
        const eyeIcon = document.getElementById('eye-icon');

        togglePasswordBtn.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
        });

        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length >= 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === "Backspace" && e.target.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        const otpBtn = document.getElementById('otp-request-btn');
        const loginSubmitBtn = document.getElementById('login-submit-btn');
        const loginForm = document.querySelector('form');
        const lockPopup = document.getElementById('lock-popup');
        const countdownTimerEl = document.getElementById('countdown-timer');
        const lockMessageEl = document.getElementById('lock-message');
        let globalLockInterval = null;

        // ฟังก์ชันสั่งแสดง Pop-up นับถอยหลัง (จะทำงานต่อเมื่อถูกเรียกจากผลลัพธ์หลังบ้านเท่านั้น)
        function startLockCountdown(lockUntilMs, customMessage) {
            if (globalLockInterval) clearInterval(globalLockInterval);

            if (customMessage) lockMessageEl.innerText = customMessage;

            otpBtn.disabled = true;
            otpBtn.classList.add('text-gray-400', 'cursor-not-allowed');
            loginSubmitBtn.disabled = true;
            loginSubmitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            lockPopup.classList.remove('hidden');

            globalLockInterval = setInterval(() => {
                const now = Date.now();
                const distance = lockUntilMs - now;

                if (distance <= 0) {
                    clearInterval(globalLockInterval);
                    globalLockInterval = null;
                    lockPopup.classList.add('hidden');

                    otpBtn.disabled = false;
                    otpBtn.classList.remove('text-gray-400', 'cursor-not-allowed');
                    loginSubmitBtn.disabled = false;
                    loginSubmitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    return;
                }

                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                countdownTimerEl.innerText = 
                    `${String(hours).padStart(2, '0')} : ${String(minutes).padStart(2, '0')} : ${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        let timer = null;
        otpBtn.addEventListener('click', async () => {
            if (timer !== null) return;

            const emailValue = loginForm.querySelector('input[type="email"]').value;
            const passwordValue = passwordInput.value;

            if (!emailValue || !passwordValue) {
                alert("⚠️ โปรดระบุ อีเมล และ รหัสผ่าน ให้ครบถ้วนก่อนขอรหัส OTP");
                return;
            }

            try {
                otpBtn.disabled = true;
                otpBtn.innerText = "กำลังส่งรหัส...";

                const response = await fetch('/api/auth/request-otp', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: emailValue, password: passwordValue })
});

                const result = await response.json();

                if (!response.ok || !result.success) {
                    if (result.lockUntilMs) {
                        startLockCountdown(result.lockUntilMs, result.message);
                    }
                    alert("❌ ขอรหัสไม่สำเร็จ: " + result.message);
                    otpBtn.disabled = false;
                    otpBtn.innerText = "ขอรหัส OTP";
                    return;
                }

                alert("📧 รหัส OTP ถูกส่งเข้าอีเมลของคุณแล้ว! (มีอายุใช้งาน 3 นาที)");

                let timeLeft = 60;
                otpBtn.classList.remove('text-purple-600', 'hover:underline');
                otpBtn.classList.add('text-gray-500', 'cursor-not-allowed');
                otpBtn.innerText = `กรุณาลองใหม่ในอีก ${timeLeft}s`;

                timer = setInterval(() => {
                    timeLeft--;
                    if (timeLeft <= 0) {
                        clearInterval(timer);
                        timer = null;
                        otpBtn.disabled = false;
                        otpBtn.classList.remove('text-gray-500', 'cursor-not-allowed');
                        otpBtn.classList.add('text-purple-600', 'hover:underline');
                        otpBtn.innerText = "ขอรหัส OTP";
                    } else {
                        otpBtn.innerText = `กรุณาลองใหม่ในอีก ${timeLeft}s`;
                    }
                }, 1000);

            } catch (error) {
                console.error(error);
                alert("❌ ระบบขัดข้อง ไม่สามารถเชื่อมต่อหลังบ้านได้");
                otpBtn.disabled = false;
                otpBtn.innerText = "ขอรหัส OTP";
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const emailValue = loginForm.querySelector('input[type="email"]').value;
            const passwordValue = passwordInput.value;
            
            const passwordRegex = /^[A-Za-z0-9!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]{8}$/;
            if (!passwordRegex.test(passwordValue)) {
                alert("❌ รหัสผ่านต้องมีความยาว 8 ตัวอักษรเท่านั้น (ประกอบด้วยภาษาอังกฤษ ตัวเลข หรืออักขระพิเศษ)");
                return;
            }

            let otpValue = "";
            inputs.forEach(input => otpValue += input.value);

            if (otpValue.length < 6) {
                alert("⚠️ โปรดระบุรหัส OTP ให้ครบถ้วนทั้ง 6 หลัก");
                return;
            }

            try {
                const response = await fetch('/api/auth/verify-login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: emailValue, password: passwordValue, otp: otpValue })
});

                const result = await response.json();

                if (response.ok && result.success) {
                    const userIdentifier = result.token || result.uid;
                    if (userIdentifier) {
                        localStorage.setItem('bblock_user_token', userIdentifier);
                    }

                    alert("🎉 เข้าสู่ระบบสำเร็จ ยินดีต้อนรับกลับเข้าสู่ BBlockWallet!");
                    window.location.href = "homel.html"; 
                } else {
                    if (result.lockUntilMs) {
                        startLockCountdown(result.lockUntilMs, result.message);
                    }
                    alert("❌ เข้าสู่ระบบล้มเหลว: " + result.message);
                }
            } catch (error) {
                console.error(error);
                alert("❌ ไม่สามารถติดต่อเซิร์ฟเวอร์หลังบ้านได้");
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const footer = document.getElementById('app-footer');
            if (footer) {
                footer.innerHTML = `
                    <footer class="w-full bg-[#0c0b24] text-white py-4 text-center text-[10px] text-gray-400 border-t border-white/5">
                        Copyright © 2026 BBlockWallet.com. All rights reserved.
                    </footer>
                `;
            }
        });
    </script>
</body>
</html>
